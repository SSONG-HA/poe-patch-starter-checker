name: build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Build executable
        run: pyinstaller --noconfirm --clean --onefile --windowed --name PoE-Patch-Starter-Checker --add-data "poe_checker/data;poe_checker/data" main.py
      - name: Smoke test (CLI mode)
        shell: pwsh
        run: |
          $p1 = Start-Process ".\dist\PoE-Patch-Starter-Checker.exe" -Wait -PassThru -ArgumentList "--version"
          if ($p1.ExitCode -ne 0) { exit $p1.ExitCode }
          $p2 = Start-Process ".\dist\PoE-Patch-Starter-Checker.exe" -Wait -PassThru -ArgumentList "--patch-file tests/fixtures/patch_notes_synthetic_full.txt --quiet --json out.json"
          if ($p2.ExitCode -ne 0) { exit $p2.ExitCode }
          Get-Content out.json | Select-Object -First 5
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PoE-Patch-Starter-Checker-windows
          path: dist/PoE-Patch-Starter-Checker.exe
          if-no-files-found: error

  release:
    needs: build-windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PoE-Patch-Starter-Checker-windows
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/PoE-Patch-Starter-Checker.exe
